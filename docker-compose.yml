services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # DATABASE_URL is required: DukaStock uses a cloud PostgreSQL provider
      # (Neon). Pass the "pooled" connection string with ?pgbouncer=true via
      # the container environment or secrets manager, e.g.:
      #   DATABASE_URL="postgresql://USER:PASSWORD@HOST-pooler.REGION.aws.neon.tech/DB?sslmode=require&pgbouncer=true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon PostgreSQL) in .env}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      COOKIE_SECURE: "true"
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      STATIC_DIR: /app/client/dist
    ports:
      - "${PORT:-4000}:4000"

volumes:
  redisdata:
